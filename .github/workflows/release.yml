name: CI / Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality-checks:
    name: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: userscript-${{ github.ref_name }}
          path: dist/rj-warp-gate.user.js
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Validate tag and package version
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Check for an existing release
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME already exists; publishing will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release artifact
        if: steps.existing_release.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: userscript-${{ github.ref_name }}
          path: dist

      - name: Generate Changelog
        if: steps.existing_release.outputs.exists != 'true'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            LOGS=$(git log "$GITHUB_REF_NAME" --pretty=format:"- %s" --no-merges)
          else
            LOGS=$(git log "$PREV_TAG..$GITHUB_REF_NAME" --pretty=format:"- %s" --no-merges)
          fi
          {
            echo "body<<EOF"
            echo "### Changes"
            echo "$LOGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: steps.existing_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: RJ-Warp-Gate ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: dist/rj-warp-gate.user.js
          fail_on_unmatched_files: true
          make_latest: true
